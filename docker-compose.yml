name: nocfinity-shop

x-backend: &backend
  # One shared image for app, queue and scheduler so they can never drift apart.
  image: nocfinity-shop-backend:local
  build:
    context: ./backend
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ./backend:/var/www/html
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    COMPOSER_HOME: /tmp/composer
    HOME: /tmp
    REDIS_HOST: redis
    MEILISEARCH_HOST: http://meilisearch:7700
    MEILISEARCH_KEY: local-dev-master-key-change-me
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    meilisearch:
      condition: service_healthy

services:
  app:
    <<: *backend
    environment:
      CONTAINER_ROLE: app
      DB_HOST: mysql
      DB_PORT: 3306
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      COMPOSER_HOME: /tmp/composer
      HOME: /tmp
      REDIS_HOST: redis
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: local-dev-master-key-change-me
    healthcheck:
      test: ["CMD", "test", "-f", "storage/framework/.ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://nginx
    environment:
      # Server-side calls and the /storage rewrite reach Laravel over the compose network.
      API_URL: http://nginx
      # Plain-HTTP localhost demo; set to true behind HTTPS.
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - nginx

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local-dev-master-key-change-me
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql-data:
  redis-data:
  meili-data:
