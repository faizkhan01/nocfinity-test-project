name: nocfinity-shop

x-backend: &backend
  build:
    context: ./backend
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ./backend:/var/www/html
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    COMPOSER_HOME: /tmp/composer
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *backend
    environment:
      CONTAINER_ROLE: app
      DB_HOST: mysql
      DB_PORT: 3306
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      COMPOSER_HOME: /tmp/composer
    healthcheck:
      test: ["CMD", "test", "-f", "storage/framework/.ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql-data:
